version: "3.9"

#
# Docker Compose configuration for BFIS service
#
# - Dev profile: mounts src/ and shared-schemas/ for hot reload with `npm run dev`
# - Prod profile: runs compiled build with minimal runtime image
#

services:
  bfis-service-dev:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: bfis-service/Dockerfile
    container_name: bfis-service-dev
    ports:
      # Expose chat interface port for testing from host
      - "4513:4513"
    environment:
      # Olympus frontend proxy; BFIS talks to Olympus via this base URL.
      # Adjust host/port as needed for your environment.
      - BFIS_OLYMPUS_BASE_URL=http://192.168.1.4:3000/olympus
      # Optional: healthcheck will curl this URL if set.
      - BFIS_HEALTHCHECK_URL=http://192.168.1.4:3000/olympus/mission
      - BFIS_LOG_LEVEL=debug
    working_dir: /app/bfis-service
    volumes:
      # Live-edit BFIS source and shared schemas during development.
      - ../bfis-service/src:/app/bfis-service/src
      - ../shared-schemas:/app/shared-schemas
      # Mount logs directory so logs persist on host
      - ../bfis-service/logs:/app/bfis-service/logs
      # Mount local Olympus creds so BFIS can read /home/dcs/.creds/olympus_env.txt
      - /home/dcs/.creds:/home/dcs/.creds:ro
    restart: unless-stopped

  bfis-service:
    profiles: ["prod"]
    build:
      context: ..
      dockerfile: bfis-service/Dockerfile
    container_name: bfis-service
    ports:
      # Expose chat interface port for testing from host
      - "4513:4513"
    environment:
      - BFIS_OLYMPUS_BASE_URL=http://192.168.1.4:3000/olympus
      - BFIS_HEALTHCHECK_URL=http://192.168.1.4:3000/olympus/mission
      - BFIS_LOG_LEVEL=info
    working_dir: /app/bfis-service
    restart: unless-stopped
    volumes:
      # Mount logs directory so logs persist on host
      - ../bfis-service/logs:/app/bfis-service/logs
      # Mount local Olympus creds for production container as well.
      - /home/dcs/.creds:/home/dcs/.creds:ro
